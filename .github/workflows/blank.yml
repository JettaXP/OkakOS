name: Build OkakOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: artixlinux/artixlinux:base-openrc
      options: --privileged

    steps:
      - name: Install base dependencies
        run: |
          echo 'nameserver 8.8.8.8' >> /etc/resolv.conf
          echo 'nameserver 1.1.1.1' >> /etc/resolv.conf
          pacman-key --init
          pacman-key --populate artix
          pacman -Sy --noconfirm
          pacman -S --noconfirm artix-archlinux-support
          pacman-key --populate archlinux
          echo '' >> /etc/pacman.conf
          echo '[extra]' >> /etc/pacman.conf
          echo 'Include = /etc/pacman.d/mirrorlist-arch' >> /etc/pacman.conf
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso base-devel git sudo squashfs-tools python-build python-installer python-wheel python-setuptools imagemagick dos2unix

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Yay-bin and Custom Repo
        run: |
          mkdir -p /tmp/custom_repo
          chmod 777 /tmp/custom_repo
          
          useradd -m -G wheel -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          chown -R builder:builder /tmp/custom_repo
          
          su - builder -c "git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"
          su - builder -c "cd /tmp/yay-bin && makepkg -s --noconfirm"
          
          cp /tmp/yay-bin/*.pkg.tar.zst /tmp/custom_repo/
          
          su - builder -c "repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/custom_repo/*.pkg.tar.zst"
          
          echo "" >> /etc/pacman.conf
          echo "[custom]" >> /etc/pacman.conf
          echo "SigLevel = Optional TrustAll" >> /etc/pacman.conf
          echo "Server = file:///tmp/custom_repo" >> /etc/pacman.conf
          
          pacman -Sy --noconfirm yay-bin

      - name: Build Calamares from AUR
        run: |
          su - builder -c "git clone https://aur.archlinux.org/calamares.git /tmp/calamares"
          su - builder -c "cd /tmp/calamares && makepkg -s --noconfirm"

          mkdir -p /tmp/cala-repack
          cd /tmp/cala-repack
          CALA_PKG=$(ls /tmp/calamares/calamares-*.pkg.tar.zst)
          tar xf "$CALA_PKG"
          rm -f usr/share/calamares/settings.conf
          rm -f usr/lib/calamares/modules/shellprocess/shellprocess.conf
          tar cf "$CALA_PKG" --zstd .
          cd /

          cp /tmp/calamares/*.pkg.tar.zst /tmp/custom_repo/
          repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/custom_repo/*.pkg.tar.zst

      - name: Build OkakInstall
        run: |
          pacman -Sy
          git clone https://github.com/archlinux/archinstall.git /tmp/okakinstall-src
          cd /tmp/okakinstall-src

          mv archinstall okakinstall
          rm -rf examples okakinstall/examples

          find . -type f -name '*.py' -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f -name '*.py' -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +
          find . -type f -name '*.py' -exec sed -i 's/ArchInstall/OkakInstall/g' {} +
          find . -type f \( -name '*.py' -o -name '*.json' \) -exec sed -i 's/xf86-video-vmware/xorg-xinit/g' {} +

          python3 - << 'PYEOF'
          import os, re, glob

          guided_path = 'okakinstall/scripts/guided.py'
          if os.path.exists(guided_path):
              with open(guided_path, 'r') as f:
                  content = f.read()
          
              old = 'installation.genfstab()'
              new = """import subprocess, os as _os
          \t\tif _os.path.exists(str(installation.target) + "/etc"):
          \t\t\t_t = str(installation.target)
          \t\t\tsubprocess.run(f"cp -a /tmp/custom_repo {_t}/var/tmp/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"echo '' >> {_t}/etc/pacman.conf; echo '[artix]' >> {_t}/etc/pacman.conf; echo 'Server = https://mirrors.artixlinux.org/artix/os/$arch' >> {_t}/etc/pacman.conf; echo 'SigLevel = Optional TrustAll' >> {_t}/etc/pacman.conf; echo '' >> {_t}/etc/pacman.conf; echo '[system]' >> {_t}/etc/pacman.conf; echo 'Server = https://mirrors.artixlinux.org/system/os/$arch' >> {_t}/etc/pacman.conf; echo 'SigLevel = Optional TrustAll' >> {_t}/etc/pacman.conf; echo '' >> {_t}/etc/pacman.conf; echo '[world]' >> {_t}/etc/pacman.conf; echo 'Server = https://mirrors.artixlinux.org/world/os/$arch' >> {_t}/etc/pacman.conf; echo 'SigLevel = Optional TrustAll' >> {_t}/etc/pacman.conf", shell=True)
          \t\t\tsubprocess.run(f'echo "" >> {_t}/etc/pacman.conf; echo "[custom]" >> {_t}/etc/pacman.conf; echo "SigLevel = Optional TrustAll" >> {_t}/etc/pacman.conf; echo "Server = file:///var/tmp/custom_repo" >> {_t}/etc/pacman.conf', shell=True)
          \t\t\tsubprocess.run(f"arch-chroot {_t} pacman -Sy --noconfirm artix-keyring 2>/dev/null || true", shell=True)
          \t\t\tsubprocess.run(f"arch-chroot {_t} pacman-key --populate artix 2>/dev/null || true", shell=True)
          \t\t\tsubprocess.run(f"arch-chroot {_t} pacman -Sy --noconfirm yay-bin nano git fish fastfetch xdg-user-dirs base-devel sudo opendoas polkit reflector firefox", shell=True)
          \t\t\tsubprocess.run(f"mkdir -p {_t}/etc/skel {_t}/usr/share/fastfetch/logos {_t}/usr/local/bin {_t}/etc/fastfetch {_t}/etc/fish {_t}/etc/polkit-1/rules.d {_t}/etc/default", shell=True)
          \t\t\tsubprocess.run(f"cp -a /etc/skel/. {_t}/etc/skel/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /etc/fish/. {_t}/etc/fish/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /etc/fastfetch/. {_t}/etc/fastfetch/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /etc/default/grub {_t}/etc/default/grub 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /usr/share/backgrounds {_t}/usr/share/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /usr/share/gnome-background-properties {_t}/usr/share/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /usr/share/grub {_t}/usr/share/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /usr/share/fastfetch/logos/okakos {_t}/usr/share/fastfetch/logos/okakos 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /usr/share/applications {_t}/usr/share/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"rm -f {_t}/usr/share/applications/okakinstall.desktop {_t}/usr/share/applications/calamares.desktop 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /usr/local/bin/* {_t}/usr/local/bin/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp -a /etc/polkit-1/rules.d/* {_t}/etc/polkit-1/rules.d/ 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"chmod +x {_t}/usr/local/bin/* 2>/dev/null", shell=True)
          \t\t\tsubprocess.run(f"cp /usr/local/bin/okakos-post-install.sh {_t}/root/ && arch-chroot {_t} bash /root/okakos-post-install.sh && rm -f {_t}/root/okakos-post-install.sh", shell=True)
          \t\tinstallation.genfstab()"""
          
              content = content.replace(old, new)
              with open(guided_path, 'w') as f:
                  f.write(content)
              print("[OK] Patched guided.py")
          else:
              print("[WARN] guided.py not found at", guided_path)
          
          version_path = 'okakinstall/lib/version.py'
          if os.path.exists(version_path):
              with open(version_path, 'w') as f:
                  f.write("def get_version() -> str:\n\treturn 'OkakOS 67'\n")
              print("[OK] Patched version.py")

          for py_file in glob.glob('./**/*.py', recursive=True):
              try:
                  with open(py_file, 'r') as f:
                      content = f.read()
                  original = content
                  content = re.sub(r"""f'systemctl enable \{"--now " if \w+ else ""\}\{(\w+)\}'""", r"f'rc-update add {\1} default'", content)
                  content = re.sub(r"f'systemctl enable \{(\w+)\}'", r"f'rc-update add {\1} default'", content)
                  content = re.sub(r'f"systemctl enable \{(\w+)\}"', r'f"rc-update add {\1} default"', content)
                  content = re.sub(r"'systemctl enable --now ([^']*)'", r"'rc-service \1 start'", content)
                  content = re.sub(r"'systemctl enable ([^']*)'", r"'rc-update add \1 default'", content)
                  content = re.sub(r"'systemctl disable ([^']*)'", r"'rc-update del \1 default'", content)
                  content = re.sub(r"'systemctl start ([^']*)'", r"'rc-service \1 start'", content)
                  content = re.sub(r"'systemctl stop ([^']*)'", r"'rc-service \1 stop'", content)
                  content = re.sub(r"'systemctl restart ([^']*)'", r"'rc-service \1 restart'", content)
                  content = re.sub(r'"systemctl enable --now ([^"]*)"', r'"rc-service \1 start"', content)
                  content = re.sub(r'"systemctl enable ([^"]*)"', r'"rc-update add \1 default"', content)
                  content = re.sub(r'"systemctl disable ([^"]*)"', r'"rc-update del \1 default"', content)
                  content = re.sub(r'"systemctl start ([^"]*)"', r'"rc-service \1 start"', content)
                  content = re.sub(r'"systemctl stop ([^"]*)"', r'"rc-service \1 stop"', content)
                  content = re.sub(r'"systemctl restart ([^"]*)"', r'"rc-service \1 restart"', content)
                  for cmd in [' default', ' start', ' stop', ' restart']:
                      content = content.replace('.service' + cmd, cmd)
                  content = content.replace('systemd-networkd', 'NetworkManager')
                  content = content.replace('systemd-resolved', 'NetworkManager')
                  if content != original:
                      with open(py_file, 'w') as f:
                          f.write(content)
              except Exception:
                  pass
          print("[OK] Patched systemd -> OpenRC in all Python files")
          PYEOF

          sed -i 's/archinstall/okakinstall/g' pyproject.toml
          sed -i 's/Arch Linux/OkakOS 67/g' pyproject.toml
          sed -i 's/archinstall\.main:main/okakinstall.main:main/g' pyproject.toml

          find . -type f \( -name '*.po' -o -name '*.pot' \) -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f \( -name '*.po' -o -name '*.pot' \) -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +

          find . -type f \( -name '*.toml' -o -name '*.cfg' -o -name '*.json' -o -name '*.md' \) -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f \( -name '*.json' -o -name '*.md' \) -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +

          chown -R builder:builder /tmp/okakinstall-src
          su - builder -c "cd /tmp/okakinstall-src && python -m build --wheel --no-isolation"

          mkdir -p /tmp/okakinstall-pkg
          cp /tmp/okakinstall-src/dist/*.whl /tmp/okakinstall-pkg/

          cat > /tmp/okakinstall-pkg/PKGBUILD << 'PKGEOF'
          pkgname=okakinstall
          pkgver=1.0
          pkgrel=1
          pkgdesc='OkakOS 67 Installer'
          arch=('any')
          license=('GPL-3.0-only')
          depends=(
            'arch-install-scripts'
            'btrfs-progs'
            'coreutils'
            'cryptsetup'
            'dosfstools'
            'e2fsprogs'
            'f2fs-tools'
            'glibc'
            'kbd'
            'libcrypt.so'
            'libfido2'
            'libxcrypt'
            'lvm2'
            'pciutils'
            'procps-ng'
            'python'
            'python-cryptography'
            'python-linkify-it-py'
            'python-markdown-it-py'
            'python-pydantic'
            'python-pyparted'
            'python-textual'
            'openrc'
            'util-linux'
            'xfsprogs'
          )
          
          package() {
              python -m installer --destdir="$pkgdir" /tmp/okakinstall-pkg/*.whl
          }
          PKGEOF
          sed -i 's/^          //' /tmp/okakinstall-pkg/PKGBUILD

          chown -R builder:builder /tmp/okakinstall-pkg
          su - builder -c "cd /tmp/okakinstall-pkg && makepkg -fs --noconfirm"
          cp /tmp/okakinstall-pkg/*.pkg.tar.zst /tmp/custom_repo/
          repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/okakinstall-pkg/*.pkg.tar.zst

      - name: Prepare OkakOS Profile
        run: |
          cp -r /usr/share/archiso/configs/releng ./okakos-profile

          # Fix [core] and [extra] to use Arch mirrorlist (artix-archlinux-support provides mirrorlist-arch)
          sed -i 's|Include = /etc/pacman.d/mirrorlist$|Include = /etc/pacman.d/mirrorlist-arch|g' ./okakos-profile/pacman.conf

          sed -i '/^archinstall$/d' ./okakos-profile/packages.x86_64
          sed -i '/^zsh$/d' ./okakos-profile/packages.x86_64
          sed -i '/^grml-zsh-config$/d' ./okakos-profile/packages.x86_64
          sed -i '/^vim$/d' ./okakos-profile/packages.x86_64

          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/syslinux/*.cfg 2>/dev/null || true
          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/grub/grub.cfg 2>/dev/null || true
          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/efiboot/loader/entries/*.conf 2>/dev/null || true
          sed -i 's/archlinux/okakos/g' ./okakos-profile/syslinux/*.cfg 2>/dev/null || true
          sed -i 's/archlinux/okakos/g' ./okakos-profile/grub/grub.cfg 2>/dev/null || true

          cp airootfs/usr/share/grub/background.jpg ./okakos-profile/syslinux/splash.jpg 2>/dev/null || true
          magick ./okakos-profile/syslinux/splash.jpg -resize 640x480\! ./okakos-profile/syslinux/splash.png 2>/dev/null || true

          echo '' >> ./okakos-profile/pacman.conf
          echo '[artix]' >> ./okakos-profile/pacman.conf
          echo 'Server = https://mirrors.artixlinux.org/$repo/os/$arch' >> ./okakos-profile/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> ./okakos-profile/pacman.conf
          echo '' >> ./okakos-profile/pacman.conf
          echo '[system]' >> ./okakos-profile/pacman.conf
          echo 'Server = https://mirrors.artixlinux.org/$repo/os/$arch' >> ./okakos-profile/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> ./okakos-profile/pacman.conf
          echo '' >> ./okakos-profile/pacman.conf
          echo '[world]' >> ./okakos-profile/pacman.conf
          echo 'Server = https://mirrors.artixlinux.org/$repo/os/$arch' >> ./okakos-profile/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> ./okakos-profile/pacman.conf
          echo '' >> ./okakos-profile/pacman.conf
          echo '[galaxy]' >> ./okakos-profile/pacman.conf
          echo 'Server = https://mirrors.artixlinux.org/$repo/os/$arch' >> ./okakos-profile/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> ./okakos-profile/pacman.conf
          echo '' >> ./okakos-profile/pacman.conf
          echo '[custom]' >> ./okakos-profile/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> ./okakos-profile/pacman.conf
          echo 'Server = file:///tmp/custom_repo' >> ./okakos-profile/pacman.conf

          cp -r airootfs/* ./okakos-profile/airootfs/
          echo 'okakinstall' >> ./okakos-profile/packages.x86_64
          echo 'yay-bin' >> ./okakos-profile/packages.x86_64
          cat packages.x86_64 >> ./okakos-profile/packages.x86_64

          sed -i '/^python-simple-term-menu$/d' ./okakos-profile/packages.x86_64
          
          find ./okakos-profile/airootfs/usr/local/bin/ -type f -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.fish' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.sh' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.conf' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/init.d/ -type f -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/conf.d/ -type f -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.desktop' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/usr/share/applications/ -name '*.desktop' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/root/ -name '*.fish' -exec dos2unix {} \;

          mkdir -p ./okakos-profile/airootfs/etc/runlevels/default/
          chmod +x ./okakos-profile/airootfs/etc/init.d/okakos67
          ln -sf /etc/init.d/okakos67 ./okakos-profile/airootfs/etc/runlevels/default/okakos67
          ln -sf /etc/init.d/NetworkManager ./okakos-profile/airootfs/etc/runlevels/default/NetworkManager

          sed -i 's|/usr/bin/zsh|/usr/bin/fish|g' ./okakos-profile/airootfs/etc/passwd 2>/dev/null || true
          chmod +x ./okakos-profile/airootfs/usr/local/bin/*

          rm -f ./okakos-profile/airootfs/usr/share/applications/calamares.desktop 2>/dev/null || true

          if [ -f ./okakos-profile/profiledef.sh ]; then
            sed -i 's/iso_name="archlinux"/iso_name="okakos"/g' ./okakos-profile/profiledef.sh
            sed -i 's/iso_label="ARCH_/iso_label="OKAKOS_/g' ./okakos-profile/profiledef.sh
            sed -i "s/iso_publisher=\"Arch Linux/iso_publisher=\"OkakOS/g" ./okakos-profile/profiledef.sh
            sed -i "s/iso_application=\"Arch Linux/iso_application=\"OkakOS/g" ./okakos-profile/profiledef.sh
            sed -i "s/^airootfs_image_tool_options.*/airootfs_image_tool_options=('-comp' 'xz' '-b' '1M')/g" ./okakos-profile/profiledef.sh

            echo "" >> ./okakos-profile/profiledef.sh
            echo "file_permissions+=(" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakos-welcome']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakos-post-install.sh']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakos-live-setup.sh']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/pocoyo-optimizator']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/welcome']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/67wm-troll']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/start-67wm']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakinstall']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/etc/doas.conf']='0:0:400'" >> ./okakos-profile/profiledef.sh
            echo ")" >> ./okakos-profile/profiledef.sh
          fi

      - name: Build ISO
        run: |
          mkarchiso -v -w /tmp/archiso-tmp -o /tmp/out ./okakos-profile

      - name: Rename ISO
        run: |
          cd /tmp/out
          for f in *.iso; do
            DATE=$(date +%Y.%m.%d)
            mv "$f" "OkakOS-67-${DATE}.iso"
          done

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkakOS-ISO
          path: /tmp/out/*.iso
          retention-days: 7
