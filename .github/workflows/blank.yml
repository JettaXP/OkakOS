name: Build OkakOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso base-devel git sudo squashfs-tools python-build python-installer python-wheel python-setuptools imagemagick dos2unix

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Yay-bin and okakinstall Custom Repo
        run: |
          mkdir -p /tmp/custom_repo
          chmod 777 /tmp/custom_repo
          
          useradd -m -G wheel -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          chown -R builder:builder /tmp/custom_repo
          
          su - builder -c "git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"
          su - builder -c "cd /tmp/yay-bin && makepkg -s --noconfirm"
          
          cp /tmp/yay-bin/*.pkg.tar.zst /tmp/custom_repo/
          
          su - builder -c "repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/custom_repo/*.pkg.tar.zst"
          
          echo "" >> /etc/pacman.conf
          echo "[custom]" >> /etc/pacman.conf
          echo "SigLevel = Optional TrustAll" >> /etc/pacman.conf
          echo "Server = file:///tmp/custom_repo" >> /etc/pacman.conf
          
          pacman -Sy --noconfirm yay-bin

      - name: Build Calamares from AUR
        run: |
          su - builder -c "git clone https://aur.archlinux.org/calamares.git /tmp/calamares"
          su - builder -c "cd /tmp/calamares && makepkg -s --noconfirm"
          cp /tmp/calamares/*.pkg.tar.zst /tmp/custom_repo/
          repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/custom_repo/*.pkg.tar.zst

      - name: Build python-simple-term-menu from AUR
        run: |
          su - builder -c "git clone https://aur.archlinux.org/python-simple-term-menu.git /tmp/python-simple-term-menu"
          su - builder -c "cd /tmp/python-simple-term-menu && makepkg -s --noconfirm"
          cp /tmp/python-simple-term-menu/*.pkg.tar.zst /tmp/custom_repo/
          repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/custom_repo/*.pkg.tar.zst

      - name: Build OkakInstall
        run: |
          pacman -Sy
          git clone https://github.com/archlinux/archinstall.git /tmp/okakinstall-src
          cd /tmp/okakinstall-src
          git checkout v2.8.0

          mv archinstall okakinstall

          find . -type f -name '*.py' -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f -name '*.py' -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +
          find . -type f -name '*.py' -exec sed -i 's/ArchInstall/OkakInstall/g' {} +

          find . -type f \( -name '*.py' -o -name '*.json' \) -exec sed -i 's/xf86-video-vmware/xorg-xinit/g' {} +
          
          cat > patch_okakos.py << 'EOF'
          import os
          
          guided_path = 'okakinstall/scripts/guided.py'
          if os.path.exists(guided_path):
              with open(guided_path, 'r') as f:
                  content = f.read()
                  
              replace_from_main = 'installation.genfstab()'
              replace_to_main = """import subprocess, os
          TABTABif os.path.exists("/mnt/etc"):
          TABTABTABsubprocess.run("cp -a /tmp/custom_repo /mnt/var/tmp/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run('echo "" >> /mnt/etc/pacman.conf; echo "[custom]" >> /mnt/etc/pacman.conf; echo "SigLevel = Optional TrustAll" >> /mnt/etc/pacman.conf; echo "Server = file:///var/tmp/custom_repo" >> /mnt/etc/pacman.conf', shell=True)
          TABTABTABsubprocess.run("arch-chroot /mnt pacman -Sy --noconfirm yay-bin nano git fish fastfetch xdg-user-dirs base-devel sudo polkit reflector firefox python-pyqt5", shell=True)
          TABTABTABsubprocess.run("mkdir -p /mnt/etc/skel /mnt/usr/share/fastfetch/logos /mnt/usr/local/bin /mnt/etc/fastfetch /mnt/etc/fish /mnt/etc/polkit-1/rules.d /mnt/etc/default", shell=True)
          TABTABTABsubprocess.run("cp -a /etc/skel/. /mnt/etc/skel/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /etc/fish/. /mnt/etc/fish/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /etc/fastfetch/. /mnt/etc/fastfetch/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /etc/default/grub /mnt/etc/default/grub 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /usr/share/backgrounds /mnt/usr/share/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /usr/share/gnome-background-properties /mnt/usr/share/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /usr/share/grub /mnt/usr/share/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /usr/share/fastfetch/logos/okakos /mnt/usr/share/fastfetch/logos/okakos 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /usr/share/applications /mnt/usr/share/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("rm -f /mnt/usr/share/applications/okakinstall.desktop /mnt/usr/share/applications/calamares.desktop 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /usr/local/bin/* /mnt/usr/local/bin/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp -a /etc/polkit-1/rules.d/* /mnt/etc/polkit-1/rules.d/ 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("chmod +x /mnt/usr/local/bin/* 2>/dev/null", shell=True)
          TABTABTABsubprocess.run("cp /usr/local/bin/okakos-post-install.sh /mnt/root/ && arch-chroot /mnt bash /root/okakos-post-install.sh && rm -f /mnt/root/okakos-post-install.sh", shell=True)
          TABTABinstallation.genfstab()""".replace("TAB", chr(9))
              content = content.replace(replace_from_main, replace_to_main)
              with open(guided_path, 'w') as f:
                  f.write(content)
          EOF
          sed -i 's/^          //' patch_okakos.py
          python patch_okakos.py

          sed -i 's/archinstall/okakinstall/g' pyproject.toml
          sed -i 's/Arch Linux/OkakOS 67/g' pyproject.toml

          find . -type f \( -name '*.po' -o -name '*.pot' \) -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f \( -name '*.po' -o -name '*.pot' \) -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +

          find . -type f \( -name '*.toml' -o -name '*.cfg' -o -name '*.json' -o -name '*.md' \) -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f \( -name '*.json' -o -name '*.md' \) -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +

          chown -R builder:builder /tmp/okakinstall-src
          su - builder -c "cd /tmp/okakinstall-src && python -m build --wheel --no-isolation"

          mkdir -p /tmp/okakinstall-pkg
          cp /tmp/okakinstall-src/dist/*.whl /tmp/okakinstall-pkg/

          cat > /tmp/okakinstall-pkg/PKGBUILD << 'PKGEOF'
          pkgname=okakinstall
          pkgver=1.0
          pkgrel=1
          pkgdesc='OkakOS 67 Installer'
          arch=('any')
          license=('GPL-3.0-only')
          depends=(
            'arch-install-scripts'
            'btrfs-progs'
            'coreutils'
            'cryptsetup'
            'dosfstools'
            'e2fsprogs'
            'f2fs-tools'
            'glibc'
            'kbd'
            'libcrypt.so'
            'libfido2'
            'libxcrypt'
            'lvm2'
            'pciutils'
            'procps-ng'
            'python'
            'python-cryptography'
            'python-linkify-it-py'
            'python-markdown-it-py'
            'python-pydantic'
            'python-simple-term-menu'
            'python-pyparted'
            'python-textual'
            'systemd'
            'util-linux'
            'xfsprogs'
          )
          
          package() {
              python -m installer --destdir="$pkgdir" /tmp/okakinstall-pkg/*.whl
          }
          PKGEOF
          sed -i 's/^          //' /tmp/okakinstall-pkg/PKGBUILD

          chown -R builder:builder /tmp/okakinstall-pkg
          su - builder -c "cd /tmp/okakinstall-pkg && makepkg -fs --noconfirm"
          cp /tmp/okakinstall-pkg/*.pkg.tar.zst /tmp/custom_repo/
          repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/okakinstall-pkg/*.pkg.tar.zst

      - name: Prepare OkakOS Profile
        run: |
          cp -r /usr/share/archiso/configs/releng ./okakos-profile

          sed -i '/^archinstall$/d' ./okakos-profile/packages.x86_64
          sed -i '/^zsh$/d' ./okakos-profile/packages.x86_64
          sed -i '/^grml-zsh-config$/d' ./okakos-profile/packages.x86_64
          sed -i '/^vim$/d' ./okakos-profile/packages.x86_64

          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/syslinux/*.cfg 2>/dev/null || true
          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/grub/grub.cfg 2>/dev/null || true
          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/efiboot/loader/entries/*.conf 2>/dev/null || true
          sed -i 's/archlinux/okakos/g' ./okakos-profile/syslinux/*.cfg 2>/dev/null || true
          sed -i 's/archlinux/okakos/g' ./okakos-profile/grub/grub.cfg 2>/dev/null || true

          cp airootfs/usr/share/grub/background.jpg ./okakos-profile/syslinux/splash.jpg 2>/dev/null || true
          magick ./okakos-profile/syslinux/splash.jpg -resize 640x480\! ./okakos-profile/syslinux/splash.png 2>/dev/null || true

          echo "" >> ./okakos-profile/pacman.conf
          echo "[custom]" >> ./okakos-profile/pacman.conf
          echo "SigLevel = Optional TrustAll" >> ./okakos-profile/pacman.conf
          echo "Server = file:///tmp/custom_repo" >> ./okakos-profile/pacman.conf

          cp -r airootfs/* ./okakos-profile/airootfs/
          echo 'okakinstall' >> ./okakos-profile/packages.x86_64
          echo 'yay-bin' >> ./okakos-profile/packages.x86_64
          cat packages.x86_64 >> ./okakos-profile/packages.x86_64

          find ./okakos-profile/airootfs/usr/local/bin/ -type f -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.fish' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.sh' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.conf' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.service' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/etc/ -name '*.desktop' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/usr/share/applications/ -name '*.desktop' -exec dos2unix {} \;
          find ./okakos-profile/airootfs/root/ -name '*.fish' -exec dos2unix {} \;

          mkdir -p ./okakos-profile/airootfs/etc/systemd/system/multi-user.target.wants/
          ln -sf /etc/systemd/system/okakos67.service ./okakos-profile/airootfs/etc/systemd/system/multi-user.target.wants/okakos67.service
          ln -sf /usr/lib/systemd/system/NetworkManager.service ./okakos-profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service

          sed -i 's|/usr/bin/zsh|/usr/bin/fish|g' ./okakos-profile/airootfs/etc/passwd 2>/dev/null || true
          sed -i 's|/usr/bin/zsh|/usr/bin/fish|g' ./okakos-profile/airootfs/etc/passwd 2>/dev/null || true
          chmod +x ./okakos-profile/airootfs/usr/local/bin/*

          rm -f ./okakos-profile/airootfs/usr/share/applications/calamares.desktop 2>/dev/null || true

          if [ -f ./okakos-profile/profiledef.sh ]; then
            sed -i 's/iso_name="archlinux"/iso_name="okakos"/g' ./okakos-profile/profiledef.sh
            sed -i 's/iso_label="ARCH_/iso_label="OKAKOS_/g' ./okakos-profile/profiledef.sh
            sed -i "s/iso_publisher=\"Arch Linux/iso_publisher=\"OkakOS/g" ./okakos-profile/profiledef.sh
            sed -i "s/iso_application=\"Arch Linux/iso_application=\"OkakOS/g" ./okakos-profile/profiledef.sh
            sed -i "s/^airootfs_image_tool_options.*/airootfs_image_tool_options=('-comp' 'xz' '-b' '1M')/g" ./okakos-profile/profiledef.sh

            echo "" >> ./okakos-profile/profiledef.sh
            echo "file_permissions+=(" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakos-welcome']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakos-post-install.sh']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakos-live-setup.sh']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/pocoyo-optimizator']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/welcome']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/67wm-troll']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/start-67wm']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo "  ['/usr/local/bin/okakinstall']='0:0:755'" >> ./okakos-profile/profiledef.sh
            echo ")" >> ./okakos-profile/profiledef.sh
          fi

      - name: Build ISO
        run: |
          mkarchiso -v -w /tmp/archiso-tmp -o /tmp/out ./okakos-profile

      - name: Rename ISO
        run: |
          cd /tmp/out
          for f in *.iso; do
            DATE=$(date +%Y.%m.%d)
            mv "$f" "OkakOS-67-${DATE}.iso"
          done

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkakOS-ISO
          path: /tmp/out/*.iso
          retention-days: 7
