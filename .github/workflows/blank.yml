name: Build OkakOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso base-devel git sudo squashfs-tools python-build python-installer python-wheel python-setuptools

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create unprivileged user for AUR
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build Calamares from AUR
        run: |
          su - builder -c "git clone https://aur.archlinux.org/calamares.git /tmp/calamares"
          su - builder -c "cd /tmp/calamares && makepkg -s --noconfirm"
          mkdir -p /tmp/custom_repo
          cp /tmp/calamares/*.pkg.tar.zst /tmp/custom_repo/
          repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/custom_repo/*.pkg.tar.zst

      - name: Build OkakInstall (rebranded archinstall)
        run: |
          git clone https://github.com/archlinux/archinstall /tmp/okakinstall-src
          cd /tmp/okakinstall-src

          mv archinstall okakinstall

          find . -type l | while read link; do
            target=$(readlink "$link")
            if echo "$target" | grep -q "archinstall"; then
              new_target=$(echo "$target" | sed 's/archinstall/okakinstall/g')
              ln -sfn "$new_target" "$link"
            fi
          done


          find . -type f -name '*.py' -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f -name '*.py' -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +
          find . -type f -name '*.py' -exec sed -i 's/ArchInstall/OkakInstall/g' {} +

          cat > patch_okakos.py << 'EOF'
          import os
          
          installer_path = 'okakinstall/lib/installer.py'
          if os.path.exists(installer_path):
              with open(installer_path, 'r') as f:
                  content = f.read()
              
              replace_from = 'def pacstrap(self, *packages: str, **kwargs: Any) -> None:'
              replace_to = """def pacstrap(self, *packages: str, **kwargs: Any) -> None:
                  packages = list(packages)
                  okak_pkgs = ["plasma-desktop", "konsole", "dolphin", "foot", "sddm", "xorg-server", "xorg-xhost", "networkmanager", "nano", "git", "fish", "fastfetch", "xdg-user-dirs", "base-devel", "sudo"]
                  for p in okak_pkgs:
                      if p not in packages:
                          packages.append(p)
          """
              content = content.replace(replace_from, replace_to)
              
              with open(installer_path, 'w') as f:
                  f.write(content)
          
          guided_path = 'okakinstall/scripts/guided.py'
          if os.path.exists(guided_path):
              with open(guided_path, 'r') as f:
                  content = f.read()
                  
              replace_from_main = 'if __name__ == "__main__":'
              replace_to_main = """
          def apply_okak_settings():
              import subprocess, os
              if os.path.exists("/mnt/etc"):
                  subprocess.run("cp /usr/local/bin/okakos-post-install.sh /mnt/root/ && arch-chroot /mnt bash /root/okakos-post-install.sh && rm -f /mnt/root/okakos-post-install.sh", shell=True)
          
          if __name__ == "__main__":
              import atexit
              atexit.register(apply_okak_settings)
          """
              content = content.replace(replace_from_main, replace_to_main)
              with open(guided_path, 'w') as f:
                  f.write(content)
          EOF
          sed -i 's/^          //' patch_okakos.py
          python patch_okakos.py

          sed -i 's/archinstall/okakinstall/g' pyproject.toml
          sed -i 's/Arch Linux/OkakOS 67/g' pyproject.toml

          find . -type f \( -name '*.po' -o -name '*.pot' \) -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f \( -name '*.po' -o -name '*.pot' \) -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +

          find . -type f \( -name '*.toml' -o -name '*.cfg' -o -name '*.json' -o -name '*.md' \) -exec sed -i 's/archinstall/okakinstall/g' {} +
          find . -type f \( -name '*.json' -o -name '*.md' \) -exec sed -i 's/Arch Linux/OkakOS 67/g' {} +

          chown -R builder:builder /tmp/okakinstall-src
          su - builder -c "cd /tmp/okakinstall-src && python -m build --wheel --no-isolation"

          mkdir -p /tmp/okakinstall-pkg
          cp /tmp/okakinstall-src/dist/*.whl /tmp/okakinstall-pkg/

          cat > /tmp/okakinstall-pkg/PKGBUILD << 'PKGEOF'
          pkgname=okakinstall
          pkgver=1.0
          pkgrel=1
          pkgdesc='OkakOS 67 Installer'
          arch=('any')
          license=('GPL-3.0-only')
          depends=(
            'arch-install-scripts'
            'btrfs-progs'
            'coreutils'
            'cryptsetup'
            'dosfstools'
            'e2fsprogs'
            'f2fs-tools'
            'glibc'
            'kbd'
            'libcrypt.so'
            'libfido2'
            'libxcrypt'
            'lvm2'
            'pciutils'
            'procps-ng'
            'python'
            'python-cryptography'
            'python-linkify-it-py'
            'python-markdown-it-py'
            'python-pydantic'
            'python-pyparted'
            'python-textual'
            'systemd'
            'util-linux'
            'xfsprogs'
          )
          
          package() {
              python -m installer --destdir="$pkgdir" /tmp/okakinstall-pkg/*.whl
          }
          PKGEOF
          sed -i 's/^          //' /tmp/okakinstall-pkg/PKGBUILD

          chown -R builder:builder /tmp/okakinstall-pkg
          su - builder -c "cd /tmp/okakinstall-pkg && makepkg -fs --noconfirm"
          cp /tmp/okakinstall-pkg/*.pkg.tar.zst /tmp/custom_repo/
          repo-add /tmp/custom_repo/custom.db.tar.gz /tmp/okakinstall-pkg/*.pkg.tar.zst

      - name: Prepare OkakOS Profile
        run: |
          cp -r /usr/share/archiso/configs/releng ./okakos-profile

          sed -i '/^archinstall$/d' ./okakos-profile/packages.x86_64
          sed -i '/^zsh$/d' ./okakos-profile/packages.x86_64
          sed -i '/^grml-zsh-config$/d' ./okakos-profile/packages.x86_64
          sed -i '/^vim$/d' ./okakos-profile/packages.x86_64

          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/syslinux/*.cfg 2>/dev/null || true
          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/grub/grub.cfg 2>/dev/null || true
          sed -i 's/Arch Linux/OkakOS 67/g' ./okakos-profile/efiboot/loader/entries/*.conf 2>/dev/null || true
          sed -i 's/archlinux/okakos/g' ./okakos-profile/syslinux/*.cfg 2>/dev/null || true
          sed -i 's/archlinux/okakos/g' ./okakos-profile/grub/grub.cfg 2>/dev/null || true

          cp splash.png ./okakos-profile/syslinux/splash.png 2>/dev/null || true

          echo "" >> ./okakos-profile/pacman.conf
          echo "[custom]" >> ./okakos-profile/pacman.conf
          echo "SigLevel = Optional TrustAll" >> ./okakos-profile/pacman.conf
          echo "Server = file:///tmp/custom_repo" >> ./okakos-profile/pacman.conf

          cp -r airootfs/* ./okakos-profile/airootfs/
          echo 'okakinstall' >> ./okakos-profile/packages.x86_64
          cat packages.x86_64 >> ./okakos-profile/packages.x86_64


          mkdir -p ./okakos-profile/airootfs/etc/systemd/system/basic.target.wants/
          ln -sf /etc/systemd/system/okakos67.service ./okakos-profile/airootfs/etc/systemd/system/basic.target.wants/okakos67.service

          rm -f ./okakos-profile/airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf 2>/dev/null || true

          mkdir -p ./okakos-profile/airootfs/etc/systemd/system/multi-user.target.wants/
          ln -sf /usr/lib/systemd/system/NetworkManager.service ./okakos-profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
          chmod +x ./okakos-profile/airootfs/usr/local/bin/*

          if [ -f ./okakos-profile/profiledef.sh ]; then
            sed -i 's/iso_name="archlinux"/iso_name="okakos"/g' ./okakos-profile/profiledef.sh
            sed -i 's/iso_label="ARCH_/iso_label="OKAKOS_/g' ./okakos-profile/profiledef.sh
            sed -i "s/iso_publisher=\"Arch Linux/iso_publisher=\"OkakOS/g" ./okakos-profile/profiledef.sh
            sed -i "s/iso_application=\"Arch Linux/iso_application=\"OkakOS/g" ./okakos-profile/profiledef.sh
            sed -i "s/^airootfs_image_tool_options.*/airootfs_image_tool_options=('-comp' 'xz' '-b' '1M')/g" ./okakos-profile/profiledef.sh
          fi

      - name: Build ISO
        run: |
          mkarchiso -v -w /tmp/archiso-tmp -o /tmp/out ./okakos-profile

      - name: Rename ISO
        run: |
          cd /tmp/out
          for f in *.iso; do
            DATE=$(date +%Y.%m.%d)
            mv "$f" "OkakOS-67-${DATE}.iso"
          done

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkakOS-ISO
          path: /tmp/out/*.iso
          retention-days: 7
