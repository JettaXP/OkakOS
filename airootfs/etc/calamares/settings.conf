---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:       desktops
    module:   netinstall
    config:   netinstall-desktops.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - netinstall@desktops
    - netinstall
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - shellprocess@okakos
    - bootloader
    - umount
  - show:
    - finished

branding: okakos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
